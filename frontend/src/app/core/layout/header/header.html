<header class="tn-header" [class.is-stuck]="fixado()">
  <div class="tn-header__inner">
    <a class="logo" routerLink="/" aria-label="Terra Nexo — página inicial" (click)="fecharMenu()">
      <tn-brand-mark [tamanho]="42" />
      <span class="logo__text">
        Terra Nexo
        <small>Urbano &amp; Rural</small>
      </span>
    </a>

    <nav class="nav" [class.is-open]="menuAberto()" id="nav-principal" aria-label="Navegação principal">
      <ul class="nav__list">
        <li>
          <a class="nav__link" routerLink="/" routerLinkActive="is-active"
             [routerLinkActiveOptions]="{ exact: true }" (click)="fecharMenu()">Início</a>
        </li>
        <li>
          <a class="nav__link" routerLink="/imoveis" routerLinkActive="is-active" (click)="fecharMenu()">Imóveis</a>
        </li>
        <li>
          <a class="nav__link" routerLink="/imoveis" [queryParams]="{ categoria: 'URBANO' }"
             (click)="fecharMenu()">Urbanos</a>
        </li>
        <li>
          <a class="nav__link" routerLink="/imoveis" [queryParams]="{ categoria: 'RURAL' }"
             (click)="fecharMenu()">Rurais</a>
        </li>
        <li>
          <a class="nav__link" href="/#servicos" (click)="fecharMenu()">Serviços</a>
        </li>
        <li>
          <a class="nav__link" href="/#contato" (click)="fecharMenu()">Contato</a>
        </li>
        <li class="nav__cta">
          <a class="btn btn--primary btn--block" href="/#proprietarios" (click)="fecharMenu()">Anunciar imóvel</a>
        </li>
      </ul>
    </nav>

    <div class="tn-header__actions">
      <button
        class="icon-btn"
        type="button"
        (click)="alternarTema()"
        [attr.aria-label]="temaAtual() === 'dark' ? 'Ativar tema claro' : 'Ativar tema escuro'"
      >
        @if (temaAtual() === 'dark') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
          </svg>
        }
      </button>

      <a class="btn btn--primary tn-header__cta" href="/#proprietarios">Anunciar imóvel</a>

      <button
        class="icon-btn nav-toggle"
        type="button"
        (click)="alternarMenu()"
        [attr.aria-expanded]="menuAberto()"
        aria-controls="nav-principal"
        [attr.aria-label]="menuAberto() ? 'Fechar menu' : 'Abrir menu'"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          @if (menuAberto()) {
            <path d="M6 6l12 12M18 6 6 18" />
          } @else {
            <path d="M4 7h16M4 12h16M4 17h16" />
          }
        </svg>
      </button>
    </div>
  </div>
</header>
