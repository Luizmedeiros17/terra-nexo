<div class="admin" [class.menu-aberto]="menuAberto()">
  <aside class="admin__lateral">
    <a class="admin__marca" routerLink="/admin">
      <tn-brand-mark [tamanho]="34" />
      <span>
        Terra Nexo
        <small>Administração</small>
      </span>
    </a>

    <nav aria-label="Navegação administrativa">
      <p class="admin__grupo">Operação</p>
      <ul>
        <li>
          <a routerLink="/admin" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="7" height="9" rx="1.5" />
              <rect x="14" y="3" width="7" height="5" rx="1.5" />
              <rect x="14" y="12" width="7" height="9" rx="1.5" />
              <rect x="3" y="16" width="7" height="5" rx="1.5" />
            </svg>
            Painel
          </a>
        </li>
        <li>
          <a routerLink="/admin/imoveis" routerLinkActive="is-active"
             [routerLinkActiveOptions]="{ exact: true }">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 10 12 4l9 6" /><path d="M5 10v9h14v-9" /><path d="M9 19v-5h6v5" />
            </svg>
            Imóveis
          </a>
        </li>
        <li>
          <a routerLink="/admin/imoveis/novo" routerLinkActive="is-active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14" />
            </svg>
            Cadastrar imóvel
          </a>
        </li>
      </ul>

      <p class="admin__grupo">Comercial</p>
      <ul>
        <li>
          <a routerLink="/admin/parceiros" routerLinkActive="is-active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 6h16M4 12h10M4 18h7" />
            </svg>
            Parceiros
          </a>
        </li>
        <li>
          <a routerLink="/admin/leads" routerLinkActive="is-active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 6h16M4 12h10M4 18h7" />
            </svg>
            Leads
          </a>
        </li>
        <li>
          <a routerLink="/admin/proprietarios" routerLinkActive="is-active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="9" cy="8" r="3.5" /><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" /><path d="M17 11h4M19 9v4" />
            </svg>
            Proprietários
          </a>
        </li>
        <li>
          <a routerLink="/admin/corretores" routerLinkActive="is-active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="3.5" /><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7" />
            </svg>
            Corretores
          </a>
        </li>
      </ul>
    </nav>

    <div class="admin__rodape">
      <a class="admin__portal" routerLink="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 6H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5" />
          <path d="M14 4h6v6M20 4l-9 9" />
        </svg>
        Abrir o portal
      </a>
    </div>
  </aside>

  <div class="admin__conteudo">
    <header class="admin__topo">
      <button class="admin__menu" type="button" (click)="alternarMenu()" aria-label="Abrir menu administrativo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>

      <div class="admin__aviso">
        Protótipo sem autenticação — o controle de acesso por perfil entra na etapa 1 do MVP.
      </div>

      <div class="admin__acoes">
        <button class="admin__icone" type="button" (click)="alternarTema()"
                [attr.aria-label]="temaAtual() === 'dark' ? 'Ativar tema claro' : 'Ativar tema escuro'">
          @if (temaAtual() === 'dark') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
            </svg>
          }
        </button>

        <div class="admin__usuario">
          <span class="admin__avatar" aria-hidden="true">LM</span>
          <span>
            <strong>{{ usuario.nome }}</strong>
            <small>{{ usuario.perfil }}</small>
          </span>
        </div>
      </div>
    </header>

    <main class="admin__principal">
      <router-outlet />
    </main>
  </div>
</div>
