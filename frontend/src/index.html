<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f3b3f">

  <link rel="icon" type="image/png" sizes="32x32" href="brand/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="brand/icon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="brand/icon-180.png">
  <link rel="manifest" href="site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,600&display=swap">

  <!-- Aplica o tema antes da primeira pintura, evitando piscar de cores -->
  <script>
    (function () {
      try {
        var salvo = localStorage.getItem('terranexo:theme');
        var escuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = salvo || (escuro ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
