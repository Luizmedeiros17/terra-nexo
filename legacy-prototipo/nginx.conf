server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    charset utf-8;
    charset_types text/css text/plain application/javascript application/json image/svg+xml;

    # ---- Compressão ----
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml
                      application/manifest+json;

    # ---- Cabeçalhos de segurança ----
    add_header X-Content-Type-Options    "nosniff"                       always;
    add_header X-Frame-Options           "SAMEORIGIN"                    always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # ---- Cache ----
    location ~* \.(css|js|svg|woff2?|png|jpe?g|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location ~* \.(html|json|xml|webmanifest)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---- Rotas ----
    location = /sitemap.xml  { default_type application/xml; }
    location = /robots.txt   { default_type text/plain; access_log off; }
    location = /site.webmanifest { default_type application/manifest+json; }

    # URLs limpas: /imoveis → imoveis.html
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    error_page 404 /index.html;
}
