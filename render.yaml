# Deploy gratuito no Render (https://render.com) — Blueprint.
#
# Dois serviços web no plano free, cada um construído a partir do seu Dockerfile:
#   terranexo-api  → Spring Boot (Java 21)
#   terranexo-web  → Angular SSR (Node/Express), que faz o proxy de /api para a API
#
# Limites do plano free que afetam este protótipo:
#   - cada serviço hiberna após ~15 min sem acesso; o primeiro acesso seguinte
#     leva cerca de um minuto (a API Java é a mais lenta para acordar);
#   - os dados ficam em memória e as mídias em /tmp: tudo volta ao seed a cada
#     hibernação ou novo deploy.

services:
  - type: web
    name: terranexo-api
    runtime: docker
    plan: free
    region: virginia
    rootDir: backend
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8080"
      # 512 MB de RAM no plano free
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC
      - key: TERRANEXO_CORS_ALLOWED_ORIGINS
        value: https://terranexo-web.onrender.com

  - type: web
    name: terranexo-web
    runtime: docker
    plan: free
    region: virginia
    rootDir: frontend
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "4000"
      # Serviços free não recebem tráfego pela rede privada do Render, por isso
      # o portal chama a API pela URL pública. Se o Render acrescentar um sufixo
      # ao nome do serviço (nome já em uso), ajuste esta URL no painel.
      - key: API_URL
        value: https://terranexo-api.onrender.com
      - key: SITE_URL
        value: https://terranexo-web.onrender.com
      # NG_ALLOWED_HOSTS não é definido aqui: o container usa o
      # RENDER_EXTERNAL_HOSTNAME que o Render injeta (ver frontend/Dockerfile).
